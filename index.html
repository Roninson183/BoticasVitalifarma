<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d2399">
  <title>Vitalifarma · Inventario y ventas</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 1. PANTALLA DE BIENVENIDA (2 segundos) -->
  <div id="splash">
    <span class="cross c1">✚</span><span class="cross c2">✚</span><span class="cross c3">✚</span><span class="cross c4">✚</span>
    <div class="logo-card"><img src="logo.png" alt="Boticas Vitalifarma"></div>
    <h1>¡Bienvenido!</h1>
    <p>MARITSA VILLALOBOS</p>
    <div class="loader"></div>
  </div>

  <!-- Mensajes de conexión (solo aparecen si algo falla) -->
  <div id="fatal" class="login-err" hidden style="margin:12px"></div>

  <!-- 2. APLICACIÓN -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <img src="logo.png" alt="Boticas Vitalifarma">
      </div>
      <div class="right">
        <button class="bell" data-act="bell" aria-label="Ver alertas">
          🔔<span id="bellCount" class="bell-count" hidden>0</span>
        </button>
      </div>
    </header>

    <!-- Las dos secciones principales (arriba en celular, tablet y PC) -->
    <div class="lines" id="lineTabs">
      <button data-act="tab" data-line="vitalifarma">BOTICAS VITALIFARMA</button>
      <button data-act="tab" data-line="natural">PRODUCTOS NATURALES</button>
    </div>

    <div id="alertBar" class="alert-bar" data-act="bell" hidden></div>

    <nav id="mainNav">
      <button data-act="nav" data-view="catalog"><span>📋</span>Catálogo</button>
      <button data-act="nav" data-view="sell"><span>🛒</span>Vender</button>
      <button data-act="nav" data-view="products"><span>📦</span>Inventario</button>
      <button data-act="nav" data-view="reports"><span>📊</span>Reportes</button>
    </nav>

    <main id="view"></main>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <!-- Librerías (necesitan internet): gráficos y lector de código de barras -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script>
    /* Registro de errores para mostrarlos en pantalla si el sistema no arranca */
    var __errs = [];
    window.addEventListener('error', function (e) {
      __errs.push(e.target && e.target.src ? 'No cargó el archivo: ' + e.target.src.split('/').pop() : (e.message || 'error desconocido'));
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      __errs.push(String((e.reason && (e.reason.message || e.reason.code)) || e.reason));
    });
  </script>
  <script>
    /* Plan de seguridad: la bienvenida se quita a los 2 s. Si el sistema aún no está listo
       se avisa "Conectando…" y, solo tras 10 s más, se muestra el error con las causas. */
    setTimeout(function () {
      var sp = document.getElementById('splash');
      if (sp) sp.classList.add('hide');
      setTimeout(function () {
        if (sp && sp.parentNode) sp.parentNode.removeChild(sp);
        if (window.__ready) return;
        var f = document.getElementById('fatal');
        f.hidden = false; f.textContent = 'Conectando con la base de datos… espere un momento.';
        setTimeout(function () {
          if (window.__ready) return;
          f.innerHTML = 'No se pudo conectar.<br>1) Ábralo con Live Server o desde su página de GitHub (no con doble clic).<br>2) Verifique que existan <b>storage.js</b> y <b>firebase-config.js</b> junto a index.html.<br>3) Pulse F12 → Console para ver el error.';
          var d = document.createElement('div');
          d.style.cssText = 'margin-top:10px;font-weight:400;word-break:break-word';
          d.textContent = 'Detalle técnico: ' + (__errs.length ? __errs.join(' | ') : 'sin errores de carga; Firebase no respondió (revise Firestore, Authentication Anónimo, reglas e internet).');
          f.appendChild(d);
        }, 10000);
      }, 700);
    }, 2000);
  </script>
  <script type="module" src="storage.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
